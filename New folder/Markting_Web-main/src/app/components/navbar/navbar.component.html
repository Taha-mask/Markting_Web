<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sirin+Stencil&display=swap" rel="stylesheet">

<nav class="navbar navbar-expand-lg bg-white shadow-sm" *ngIf="!isMessagesRoute() || !messageComponent?.isChatSelected">
  <div class="container-fluid d-flex align-items-center">
    <!-- Brand Logo -->
    <a class="navbar-brand d-flex align-items-center fw-bold " href="feed" routerlink="feed">
      <img src="images/image.png" alt="Brand Logo" width="30" class="me-2" />
      <span class="brand-name">BrandIt</span>
    </a>

    <!-- Search Bar -->
    <div class="center d-flex gap-4 align-items-center ms-0">
      <div class="search-container  d-flex align-items-center  px-3 py-1 me-0">
        <!-- Icon: Search -->
         <a routerlink="search" href="search" class="d-flex align-items-center">
        <i class="bi bi-search position-relative text-muted me-0"></i>
        </a>
        <!-- Input -->
       
        <input
          type="text"
          class="form-control border-0 "
          placeholder="Search"
          aria-label="Search"
        />
       
        <!-- Icon: Voice -->
        <i class="bi bi-mic text-muted ms-2"></i>
      </div>
      <div class="d-flex align-items-center  ms-0" >
        <!-- Create New Post Button -->
        <button class="btn btn-gradient rounded-pill px-2 py-2 align-items-center " style="font-size: 16px;" data-bs-toggle="modal" data-bs-target="#postModal">
        <span class="mobile-text text-align-center"><i class="bi bi-plus" style="font-size: 26px; cursor: pointer;"></i> </span><span class="desktop-text"> Create<span class="Create"> a new post</span> </span>
        </button>
      </div>
    </div>

    <!-- Right Section -->
    <div class="Rightsection d-flex align-items-center " >
      <a class="icon position-relative text-dark" href="messages" routerlink="messages">
        <i class="bi bi-send fs-5 px-1"></i>
        <span class="badge-dot"></span>
      </a>
      <a class="icon position-relative text-dark" href="notf" routerlink="notf">
        <i class="bi bi-bell fs-5 px-1"></i>
        <span class="badge-dot"></span>
      </a>
      <div class="dropdown">
        <i class="bi bi-list   " id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false" style="border: 1px solid #959595; border-radius: 20%; cursor: pointer; "></i>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton">
          <li *ngFor="let use of user" class="li-pro">
            <a class="dropdown-item text-decoration-none text-dark user-info d-flex align-items-center pt-3"  href="profile">
            <img [src]="use.profileImageUrl" class="me-3 fs-5">
            <div>
                <h5>{{use.username}}</h5>
            </div>
          </a>
        </li>
        <hr class=" text-center">
          <li><a class="dropdown-item fs-5" href="report" routerlink="report"><i class="bi bi-exclamation-circle me-3 fs-5"></i>Report a problem</a></li>
          <li><a class="dropdown-item fs-5" href="#"><i class="bi bi-brightness-high me-3 fs-4"></i>Switch Appearance</a></li>
          <li><a class="dropdown-item fs-5" href="account-center" routerlink="account-center"><i class="bi bi-gear me-3 fs-4"></i>Settings</a></li>
          <li><a class="dropdown-item fs-5" href="login"><i class="bi bi-person-circle me-3 fs-4"></i>Switch Accounts</a></li>
          <li><a class="dropdown-item fs-5" href="about"><i class="bi bi-info-circle me-3 fs-4"></i>About</a></li>
          <li><a class="dropdown-item fs-5" href="terms-and-privacy"><i class="bi bi-file-earmark-text me-3 fs-4"></i>Terms & Privacy</a></li>

        </ul>
      </div>
    </div>
  </div>
</nav>

<!-- Bottom Navigation Bar for Mobile -->
<div class="mobile-bottom-nav" *ngIf="!isMessagesRoute() || !messageComponent?.isChatSelected">
  <a href="feed" class="nav-item" routerLink="feed">
    <i class="bi bi-house-door "></i>
    <span>Feed</span>
  </a>
  <a href="explore" class="nav-item" routerLink="explore">
    <i class="bi bi-compass"></i>
    <span>Explore</span>
  </a>
  <a href="#" class="nav-item" data-bs-toggle="modal" data-bs-target="#postModal">
    <i class="bi bi-plus-circle"></i>
    <span>Create</span>
  </a>
  <a href="messages" class="nav-item" routerLink="messages">
    <i class="bi bi-chat"></i>
    <span>Msgs</span>
  </a>
  <a href="notf" class="nav-item">
    <i class="bi bi-bell"></i>
    <span>Notifs</span>
  </a>
</div>

<app-modal></app-modal>
<app-report></app-report>
