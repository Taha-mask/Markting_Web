<!-- Modal -->
<div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="reportModalLabel">Report a Problem</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="problemDescription" class="form-label">Please describe the problem</label>
            <textarea class="form-control" id="problemDescription" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label for="fileUpload" class="form-label">Add file (optional)</label>
            <input class="form-control" type="file" id="fileUpload">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Send report</button>
      </div>
    </div>
  </div>
</div>
