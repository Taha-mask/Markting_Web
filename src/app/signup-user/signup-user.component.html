<section>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-10 col-12">
        <!-- Form Header -->
        <div class="form-header text-center mb-4">
          <h2>Sign Up</h2>
        </div>

        <!-- Form Container -->
        <div class="form-container p-4 border rounded shadow-sm bg-white">
          <form [formGroup]="userRegisterForm" (ngSubmit)="register()">
            <!-- First Name and Second Name -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <input
                  type="text"
                  class="form-control"
                  placeholder="First Name"
                  formControlName="firstName"
                  required
                  maxlength="10"
                />
              </div>

              <div class="col-md-6 mb-3">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Second Name"
                  formControlName="secondName"
                  required
                  maxlength="10"
                />
              </div>
            </div>

            <div class="row">
              <!-- Date of Birth -->
              <div class="col-md-6 mb-3">
                <input
                  type="date"
                  class="form-control"
                  formControlName="birthDate"
                  required
                />
              </div>
              <!-- Gender -->

              <div class="col-md-6 mb-3">
                <label class="d-block mb-2">Gender</label>
                <div class="d-flex gap-3">
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      id="male"
                      value="Male"
                      formControlName="gender"
                    />
                    <label class="form-check-label" for="male">Male</label>
                  </div>
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      id="female"
                      value="Female"
                      formControlName="gender"
                    />
                    <label class="form-check-label" for="female">Female</label>
                  </div>
                </div>
              </div>
            </div>

            <!-- Email Address -->
            <div class="row">
              <div class="col-md-12 mb-3">
                <input
                  type="email"
                  class="form-control"
                  placeholder="Email Address"
                  formControlName="email"
                  required
                  maxlength="30"
                />
              </div>
            </div>

            <!-- Password & Confirm Password -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <input
                  type="password"
                  class="form-control"
                  placeholder="Password"
                  formControlName="password"
                  required
                  maxlength="30"
                />
              </div>

              <div class="col-md-6 mb-3">
                <input
                  type="password"
                  class="form-control"
                  placeholder="Confirm Password"
                  formControlName="confirmPassword"
                  required
                  maxlength="30"
                />
              </div>
            </div>

            <!-- Address -->
            <div formGroupName="address">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <input
                    type="text"
                    class="form-control"
                    placeholder="City"
                    formControlName="city"
                    required
                    maxlength="30"
                  />
                </div>

                <div class="col-md-6 mb-3">
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Street"
                    formControlName="street"
                    required
                    maxlength="30"
                  />
                </div>
              </div>
            </div>

            <!-- Phone Numbers -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <input
                  type="number"
                  class="form-control"
                  placeholder="Phone Number"
                  formControlName="primaryPhone"
                  required
                  maxlength="15"
                />
              </div>
              <div class="col-md-6 mb-3">
                <input
                  type="text"
                  class="form-control"
                  placeholder="Secondary Phone"
                  formControlName="secondaryPhone"
                  maxlength="15"
                />
              </div>
            </div>

            <!-- Country Selection -->
            <div class="row">
              <div class="col-md-12 mb-3">
                <select class="form-control" formControlName="country" required>
                  <option value="">-- Select Your Country --</option>
                  <option *ngFor="let country of countries" [value]="country">
                    {{ country }}
                  </option>
                </select>
              </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid">
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="userRegisterForm.invalid"
              >
                Sign Up
              </button>
            </div>

            <!-- Link to Sign In -->
            <div class="mt-3 text-center">
              <a href="#">Already have an account? Sign in</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
