<div class="blog-container">
  <h1>Marketing Tips</h1>
  <img src="/images/markting.jpg" alt="Marketing" class="blog-image">

  <p class="blog-content">
    Discover the latest strategies in digital marketing to boost your business.
    Learn how to engage your audience, improve conversion rates, and increase brand awareness through content, SEO, and social media marketing.
  </p>

  <div class="actions">
    <button (click)="likePost()">Like ({{ likes }})</button>
    <button (click)="sharePost()">Share</button>
  </div>



  <div id="commentTemplate" style="display: none;">
    <div class="comment-wrapper">
      <img src="/images/profile.png" class="comment-profile" alt="User profile">
      <div class="comment-text"></div>
    </div>
  </div>


  <div class="comments-section">
    <h3>Comments</h3>

    <!-- هنا تظهر التعليقات -->
    <div id="commentsSection" class="all-comments"></div>

    <textarea id="commentBox" placeholder="Write a comment..."></textarea>
    <button class="post-comment" (click)="addComment()">Post Comment</button>
  </div>
</div>
