<!-- Create Post Modal -->
<div class="modal fade" id="createPostModal" tabindex="-1" aria-labelledby="createPostModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="createPostModalLabel">Create Post</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="create-post-section">
          <div class="d-flex align-items-start">
            <img [src]="user.profileImageUrl" alt="User Avatar" class="rounded-circle me-3" style="width: 40px; height: 40px;">
            <div class="flex-grow-1">
              <textarea 
                class="form-control mb-3" 
                rows="5" 
                [(ngModel)]="postContent" 
                placeholder="What's on your mind?"
              ></textarea>
              <div class="d-flex gap-3 mb-3">
                <input 
                  type="file" 
                  id="fileInput" 
                  (change)="onFileSelected($event)" 
                  accept="image/*" 
                  style="display: none;"
                >
                <button class="btn btn-link text-decoration-none" (click)="triggerFileInput()">
                  <i class="bi bi-image"></i> Photo
                </button>
                <button class="btn btn-link text-decoration-none" (click)="toggleEmojiPicker()">
                  <i class="bi bi-emoji-smile"></i> Emoji
                </button>
              </div>
              <div *ngIf="selectedImageUrl" class="selected-image-preview mb-3">
                <img [src]="selectedImageUrl" alt="Selected image" class="img-fluid rounded" style="max-height: 200px;">
              </div>
              <div *ngIf="showEmojiPicker" class="emoji-picker-container mt-2">
                <ngx-emoji-mart (emojiSelect)="addEmoji($event)"></ngx-emoji-mart>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="addPost()" data-bs-dismiss="modal">Post</button>
      </div>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
