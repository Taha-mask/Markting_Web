  <div class="container mt-5">
    <h2 class="text-center mb-4">إنشاء حساب</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <!-- اختيار نوع الحساب -->
      <div class="form-group">
        <label>نوع الحساب</label>
        <select class="form-control" formControlName="accountType" (change)="onAccountTypeChange()">
          <option value="user">مستخدم</option>
          <option value="seller">مسوق</option>
        </select>
      </div>
  
      <!-- الاسم -->
      <div class="form-group">
        <label for="fullName">الاسم الكامل</label>
        <input type="text" class="form-control" id="fullName" formControlName="fullName" placeholder="أدخل اسمك الكامل">
      </div>
  
      <!-- البريد الإلكتروني -->
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" class="form-control" id="email" formControlName="email" placeholder="أدخل بريدك الإلكتروني">
      </div>
  
      <!-- كلمة المرور -->
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" class="form-control" id="password" formControlName="password" placeholder="أدخل كلمة المرور">
      </div>
  
      <!-- حقول إضافية إذا كان الحساب "مسوق" -->
      <div *ngIf="isSeller">
        <div class="form-group">
          <label for="storeName">اسم المتجر</label>
          <input type="text" class="form-control" id="storeName" formControlName="storeName" placeholder="أدخل اسم المتجر">
        </div>
  
        <div class="form-group">
          <label for="storeAddress">عنوان المتجر</label>
          <input type="text" class="form-control" id="storeAddress" formControlName="storeAddress" placeholder="أدخل عنوان المتجر">
        </div>
      </div>
  
      <!-- زر التسجيل -->
      <button type="submit" class="btn btn-primary btn-block mt-3" [disabled]="registerForm.invalid">تسجيل</button>
    </form>
  </div>
