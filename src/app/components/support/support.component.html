<div class="support-page">
  <div class="header">
    <div class="icon">?</div>
    <h1>Support and Help</h1>
  </div>

  <div class="faq">
    <h2>Frequently Asked Questions</h2>
    <div class="question">
      <h3>How do I reset my password?</h3>
      <p>Lorem Ipsum is simply dummy text used as a primime.</p>
    </div>
    <div class="question">
      <h3>How do I update my account information?</h3>
      <p>Lorem Ipsum is simply dummy text used as a primime.</p>
    </div>
  </div>

  <div id="alertBox" class="alert">Your message has been sent successfully!</div>

  <div class="form-container">
    <h2>Contact Us</h2>
    <form id="contactForm" (submit)="sendMessage($event)">
      <input type="text" name="name" placeholder="Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <textarea name="message" placeholder="Message" required></textarea>
      <button type="submit">Send</button>
    </form>

    <button class="show-btn" (click)="showPreviousMessages()">Show Previous Messages</button>
    <div id="messageWindow" class="message-window"></div>
  </div>
</div>
