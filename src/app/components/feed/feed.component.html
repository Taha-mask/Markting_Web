<div class="container my-5">
  <div class="row">
    <!-- Left Sidebar -->
    <div class="col-md-3 col-12">
      <div class="sidebar">
        <h5>Left Sidebar</h5>
        <ul class="list-unstyled">
          <li><a href="#">Link 1</a></li>
          <li><a href="#">Link 2</a></li>
          <li><a href="#">Link 3</a></li>
        </ul>
      </div>
    </div>

    <!-- Main Content (Feed) -->
    <div class="col-md-6 col-12 scrollable-content">
      <!-- add post -->
      <div class="card mb-4">
        <div class="card-body">
        <!-- Profile Image-->
          <div class="d-flex align-items-center mb-2">
            <img
              [src]="profileImageUrl"
              alt="Profile Picture"
              class="rounded-circle me-2"
              style="width: 40px; height: 40px;"
            />
            <input
              type="text"
              [(ngModel)]="postContent"
              class="border border-black form-control rounded-pill shadow-sm"
              placeholder="What's on your mind?"
            />
          </div>

          <!--addaion button-->
          <div class="d-flex  align-items-center mt-4">
            <button
              class=" rounded-4 px-5 py-2 btnpost"
              [disabled]="!postContent.trim()"
              (click)="addPost()"
            >
              Add Post
            </button>
            <div class="d-flex gap-3 ms-5 col-me-0">
              <div class="text-center">
                <i class="bi bi-camera fs-5"></i>
                <small class="d-block text-muted">Camera</small>
              </div>
              <div class="text-center">
                <i class="bi bi-image fs-5"></i>
                <small class="d-block text-muted">Photo</small>
              </div>
              <div class="text-center">
                <i class="bi bi-camera-reels fs-5"></i>
                <small class="d-block text-muted">Video</small>
              </div>
            </div>
          </div> <!-- End of Button Section -->
        </div> <!-- End of New Post Section -->
      </div>

      <!-- new postes-->
      <div class="card mb-4" *ngFor="let post of posts">
        <div class="card-body">

          <!-- User Info -->
          <div class="d-flex align-items-center mb-3">
            <img [src]="post.profileImageUrl" alt="Profile Picture" class="profile-pic me-3" />
            <div>
              <h6 class="m-0">{{ post.username }}</h6>
              <small class="text-muted">{{ post.timestamp | date: 'short' }}</small>
            </div>
          </div>

          <!-- Post Content -->
          <div *ngIf="!post.isEditing">
            <p>{{ post.content }}</p>
          </div>

          <!-- Post Image -->
          <div *ngIf="post.imageUrl" class="mb-3">
            <img [src]="post.imageUrl" alt="Post Image" class="img-fluid rounded" />
          </div>

          <!-- Action Buttons -->
          <div class="d-flex justify-content-between border-top pt-3">
            <button class="btn btn-light" (click)="likePost(post)">
              <i class="bi bi-hand-thumbs-up"></i> Like
              <span class="badge bg-primary">{{ post.likes }}</span>
            </button>
            <button class="btn btn-light" (click)="toggleComments(post)">
              <i class="bi bi-chat-dots"></i> Comment
            </button>
            <button class="btn btn-light" (click)="sharePost(post)">
              <i class="bi bi-share"></i> Share
            </button>
          </div>

          <!-- Comments Section -->
          <div *ngIf="post.showComments" class="mt-3">
            <h6>Comments</h6>
            <div *ngFor="let comment of post.comments" class="mb-2">
              <strong>{{ comment.username }}</strong>: {{ comment.text }}
            </div>
            <div class="d-flex align-items-center mt-2">
              <input
                type="text"
                [(ngModel)]="newComment"
                class="form-control form-control-sm"
                placeholder="Write a comment..."
              />
              <button class="btn btn-sm btn-primary ms-2" (click)="addComment(post, newComment)">
                Send
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Sidebar -->
    <div class="col-md-3 col-12">
      <div class="sidebar">
        <h5>Right Sidebar</h5>
        <ul class="list-unstyled">
          <li><a href="#">Link A</a></li>
          <li><a href="#">Link B</a></li>
          <li><a href="#">Link C</a></li>
          <button routerLink="/profile" class="btn btn-danger">Route</button>
        </ul>
      </div>
    </div>
  </div>
</div>
