<div class="container my-5">
  <div class="row">
    <!-- Left Sidebar -->
    <div class="col-md-3 col-12">
      <div class="sidebar">
        <h5>Left Sidebar</h5>
        <ul class="list-unstyled">
          <li><a href="#">= 1</a></li>
          <li><a href="#">Link 2</a></li>
          <li><a href="#">Link 3</a></li>
        </ul>
      </div>
    </div>

    <!-- Main Content (Feed) -->
    <div class="col-md-6 col-12">
      <h2 class="mb-4 text-center">New Feed</h2>

      <!-- Loop through posts -->
      <div class="card mb-4" *ngFor="let post of posts">
        <div class="card-body">

          <!-- User Info -->
<div class="d-flex align-items-center mb-3">
  <img [src]="post.profileImageUrl" alt="Profile Picture" class="profile-pic me-3">
  <div>
    <h6 class="m-0">{{ post.username }}</h6>
    <small class="text-muted">{{ post.timestamp | date: 'short' }}</small>
  </div>
</div>

          <!-- Post Content -->
        <!-- Post Content -->
<div *ngIf="!post.isEditing">
  <p>{{ post.content }}</p>
</div>



          <!-- Post Image -->
          <div *ngIf="post.imageUrl" class="mb-3">
            <img [src]="post.imageUrl" alt="Post Image" class="img-fluid rounded">
          </div>


          <!-- Action Buttons -->
<div class="d-flex justify-content-between border-top pt-3">
  <button class="btn btn-light" (click)="likePost(post)">
    <i class="bi bi-hand-thumbs-up"></i> Like <span class="badge bg-primary">{{ post.likes }}</span>
  </button>
  <button class="btn btn-light" (click)="toggleComments(post)">
    <i class="bi bi-chat-dots"></i> Comment
  </button>
  <button class="btn btn-light" (click)="sharePost(post)">
    <i class="bi bi-share"></i> Share
  </button>
</div>


          <!-- Comments Section -->
          <div *ngIf="post.showComments" class="mt-3">
            <h6>Comments</h6>
            <div *ngFor="let comment of post.comments" class="mb-2">
              <strong>{{ comment.username }}</strong>: {{ comment.text }}
            </div>
            <div class="d-flex align-items-center mt-2">
              <input type="text" [(ngModel)]="newComment" class="form-control form-control-sm" placeholder="Write a comment...">
              <button class="btn btn-sm btn-primary ms-2" (click)="addComment(post, newComment)">send</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Sidebar -->
    <div class="col-md-3 col-12">
      <div class="sidebar">
        <h5>Right Sidebar</h5>
        <ul class="list-unstyled">
          <li><a href="#">Link A</a></li>
          <li><a href="#">Link B</a></li>
          <li><a href="#">Link C</a></li>
        </ul>
      </div>
    </div>
  </div>
</div>
