<div class="page-container">
  <!-- Main Content -->
  <div class="main-content">
    <div class="saved-posts-container">
      <div class="header-section mb-4">
        <h2>Saved Posts</h2>
        
        <!-- Search and Filter Section -->
        <div class="controls-section">
          <div class="search-box">
            <input 
              type="text" 
              [(ngModel)]="searchQuery" 
              placeholder="Search saved posts..." 
              class="form-control">
          </div>
          
          <div class="filter-section">
            <select [(ngModel)]="selectedCategory" class="form-select">
              <option *ngFor="let category of categories" [value]="category">
                {{category}}
              </option>
            </select>
            
            <select [(ngModel)]="sortOption" class="form-select">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
              <option value="priceHigh">Price: High to Low</option>
              <option value="priceLow">Price: Low to High</option>
              <option value="mostLiked">Most Liked</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Loading Spinner -->
      <div *ngIf="isLoading" class="loading-spinner">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>

      <!-- Empty State -->
      <div *ngIf="!isLoading && filteredPosts.length === 0" class="empty-state">
        <i class="bi bi-bookmark-x"></i>
        <p>No saved posts found</p>
        <small *ngIf="searchQuery || selectedCategory !== 'All'">Try adjusting your filters</small>
      </div>

      <!-- Posts Grid -->
      <div class="posts-grid" *ngIf="!isLoading">
        <div *ngFor="let post of filteredPosts" class="saved-post-card" @fadeInOut>
          <div class="post-header">
            <div class="user-info">
              <img [src]="post.userImage" [alt]="post.username" class="avatar">
              <div class="user-details">
                <h6>{{post.username}}</h6>
                <small class="text-muted">{{post.timestamp | date:'medium'}}</small>
              </div>
            </div>
            <span class="category-badge">{{post.category}}</span>
          </div>

          <div class="post-content">
            <img [src]="post.imageUrl" [alt]="post.title" class="post-image">
            <div class="post-details">
              <h5>{{post.title}}</h5>
              <p>{{post.description}}</p>
              <div class="price-tag">${{post.price.toFixed(2)}}</div>
              
              <div class="post-actions">
                <div class="likes-section">
                  <button class="btn btn-like" [class.liked]="post.isLiked" (click)="toggleLike(post)">
                    <i class="bi" [class.bi-heart-fill]="post.isLiked" [class.bi-heart]="!post.isLiked"></i>
                    <span>{{post.likes}}</span>
                  </button>
                </div>

                <div class="action-buttons">
                  <button class="btn btn-outline-primary btn-sm" (click)="sharePost(post)">
                    <i class="bi bi-share"></i> Share
                  </button>
                  <button class="btn btn-primary btn-sm" (click)="orderNow(post)">
                    <i class="bi bi-cart"></i> Order Now
                  </button>
                  <button class="btn btn-outline-danger btn-sm" (click)="deletePost(post.id)">
                    <i class="bi bi-trash"></i> Remove
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Trending Sidebar -->
  <div class="trending-sidebar">
    <app-trending-sidebar class="col-md-3  mt-4 ms-3 "></app-trending-sidebar>
  </div>
</div>

<!-- Share Modal -->
<div class="modal" [class.show]="showShareModal" *ngIf="showShareModal" (click)="closeShareModal()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Share Post</h5>
        <button type="button" class="btn-close" (click)="closeShareModal()"></button>
      </div>
      <div class="modal-body">
        <div class="share-link-section">
          <input type="text" class="form-control" [value]="'https://yoursite.com/post/' + selectedPost?.id" readonly>
          <button class="btn btn-outline-primary" (click)="copyLink(selectedPost!)">
            <i class="bi bi-clipboard"></i> Copy Link
          </button>
        </div>
        
        <div class="social-share-buttons">
          <button class="btn btn-facebook" (click)="shareToSocial('facebook')">
            <i class="bi bi-facebook"></i> Facebook
          </button>
          <button class="btn btn-twitter" (click)="shareToSocial('twitter')">
            <i class="bi bi-twitter"></i> Twitter
          </button>
          <button class="btn btn-whatsapp" (click)="shareToSocial('whatsapp')">
            <i class="bi bi-whatsapp"></i> WhatsApp
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
