<div class="saved-posts-container">
  <h2>Saved Posts</h2>
  <div *ngIf="savedPosts.length === 0">
    <p>No saved posts yet.</p>
  </div>
  <div *ngFor="let post of savedPosts" class="saved-post-card mb-4 p-3 shadow rounded bg-white">
    <div class="d-flex align-items-center mb-2">
      <img [src]="post.userImage" alt="User" class="rounded-circle me-2" style="width: 40px; height: 40px;">
      <div>
        <strong>{{ post.username }}</strong>
        <div class="text-muted" style="font-size:12px">{{ post.timestamp | date:'short' }}</div>
      </div>
    </div>
    <img [src]="post.imageUrl" alt="Post Image" class="img-fluid rounded mb-2" style="max-height:200px;">
    <h5>{{ post.title }}</h5>
    <p>{{ post.description }}</p>
    <div class="d-flex gap-2">
      <button class="btn btn-danger btn-sm" (click)="deletePost(post.id)">
        <i class="bi bi-trash"></i> Delete
      </button>
      <button class="btn btn-primary btn-sm" (click)="orderNow(post)">
        <i class="bi bi-cart"></i> Order Now
      </button>
    </div>
  </div>
</div>
