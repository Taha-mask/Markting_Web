<div class="main-container">
  <aside class="stories-sidebar" [class.hidden]="!isSidebarVisible">
    <h3>Stories</h3>
    <button class="create-story">Create Story</button>
    <!-- <input #fileInput type="file" (change)="onFileSelected($event)" accept="image/*,video/*" hidden> -->
    <!-- <div *ngIf="showModal" class="modal-overlay">
      <div class="modal-content">
        <app-modalStory></app-modalStory>
        <button (click)="closeModal()">Close</button>
      </div>
    </div> -->

    <ul class="stories-list">
      <!-- story -->
      <li
        *ngFor="let story of stories_users; let i = index"
        [class.active]="i === currentStoryIndex"
        (click)="selectStory(i)"
      >
        <img [src]="story.image" alt="Story Image" />
        <div class="story-info">
          <h4>{{ story.user }}</h4>
        </div>
      </li>
    </ul>
  </aside>

  <div class="shorts-wrapper">
    <div class="short">
      <video
        #videoPlayer
        [src]="story[currentStoryIndex].src"
        autoplay
        loop
        (click)="togglePlayPause()"
        [ngClass]="{ transitioning: transitioning }"
      ></video>

      <img src="" alt="" />
      <!-- user_info-->
      <div class="user_info">
        <img src="/images/husseini.jpg" alt="User Image" />
        <h5>Al-Husseini</h5>
      </div>

      <!-- video-info-->
      <div class="video-info">
        <p class="video-description">
          {{ story[currentStoryIndex].description }}
        </p>
      </div>

      <!-- Reaction -->
      <div class="actions">
        <!-- arrow icons -->
        <div class="story-navigation">
          <button
            class="nav-btn"
            (click)="goToPreviousStory()"
            [disabled]="currentStoryIndex === 0"
          >
            <i class="fa-solid fa-arrow-up"></i>
          </button>
          <button
            class="nav-btn todown"
            (click)="goToNextStory()"
            [disabled]="currentStoryIndex === stories_users.length - 1"
          >
            <i class="fa-solid fa-arrow-down"></i>
          </button>
        </div>

          <!-- arrow icons -->
          <div class="story-navigation">
            <button
              class="nav-btn"
              (click)="goToPreviousStory()"
              [disabled]="currentStoryIndex === 0"
            >
              <i class="fa-solid fa-arrow-up"></i>
            </button>
            <button
              class="nav-btn todown"
              (click)="goToNextStory()"
              [disabled]="currentStoryIndex === stories_users.length - 1"
            >
              <i class="fa-solid fa-arrow-down"></i>
            </button>
          </div>


        <!-- like -->
        <button class="btn btn-light like-btn" (click)="toggleLike()">
          <i
            [class.bi-hand-thumbs-up-fill]="liked"
            [class.bi-hand-thumbs-up]="!liked"
          ></i>
          <span>{{ likes }}</span>
        </button>


        <!-- comments -->
        <button class="btn btn-light comments" (click)="toggleComments()">
          <i class="bi bi-chat-dots"></i>
          <span class="count-commet">{{ comments.length }}</span>
          <!--comment counter-->
        </button>

        <!-- show comments -->
        <div *ngIf="showComments" class="comments-section">
          <h4>Comments</h4>
          <div *ngFor="let comment of comments" class="comment">
            <p>{{ comment }}</p>
          </div>
          <div class="comment-input">
            <button
              class="btn btn-light close-btn closecommentBTN"
              (click)="closeCommentSection()"
            >
              <i class="fa-solid fa-xmark close"></i>
            </button>
            <div class="writeSend"></div>
            <input
              class="form-control"
              [(ngModel)]="newComment"
              placeholder="Write a comment..."
            />
            <button class="btn btn-primary send-btn" (click)="addComment()">
              Send
            </button>
          </div>
        </div>
        <!-- share -->
        <button
          class="btn btn-light share-btn"
          (click)="toggleShareSection($event)"
        >
          <i class="bi bi-share"></i>
        </button>

        <!-- share-section-->
        <div *ngIf="showShareSection" class="share-section" (click)="$event.stopPropagation()">
          <h4>Share</h4>
          <div class="share-links">
            <button class="btn btn-light">
              <img src="/icons/facebook.png" alt="Facebook" />
            </button>
            <button class="btn btn-light">
              <img src="/icons/instagram.png" alt="Instagram" />
            </button>
            <button class="btn btn-light">
              <img src="/icons/whatsapp.png" alt="WhatsApp" />
            </button>
            <button class="btn btn-light">
              <img src="/icons/link.png" alt="Link" />
            </button>
          </div>
          <button class="btn btn-light close-btn" (click)="closeShareSection()">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- زر Options -->
        <button
          class="btn btn-light options-btn"
          (click)="toggleOptions($event)"
        >
          <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>

        <!-- options-section -->
        <div *ngIf="showOptions" class="options-section" #optionsMenu>
          <button class="option-btn" (click)="showDescription()">
            Description
          </button>
          <button class="option-btn" (click)="showReport()">Report</button>
        </div>
      </div>
    </div>
  </div>
</div>
