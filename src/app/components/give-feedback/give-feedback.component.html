<div class="container feedback-form">
  <form action="" method="post">
    <h3>Drop Us A Feedback</h3>
    <div class="row">
      <div class="col">
        <input type="text" class="form-control" placeholder="Your First Name">
        <input type="text" class="form-control" placeholder="Your Phone Number">
        <p>Did you have any trouble using the website?</p>
        <div class="radio-group">
          <label><input type="radio" name="trouble"> Yes</label>
          <label><input type="radio" name="trouble"> No</label>
        </div>
        <textarea name="txtMsg" class="form-control" placeholder="Your Message or Suggestion"></textarea>
      </div>

      <div class="col">
        <input type="text" class="form-control" placeholder="Your Last Name">
        <input type="email" class="form-control" placeholder="Your Email Address">
        <p>Do you share our website with your friends?</p>
        <div class="radio-group">
          <label><input type="radio" name="share"> Yes</label>
          <label><input type="radio" name="share"> No</label>
        </div>
        <p>What number of stars do you give us?</p>
        <div class="rating">
          <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
        </div>
      </div>
    </div>

    <div class="btn-container">
      <button class="btnfeedback">Send Feedback</button>
    </div>
  </form>
</div>
