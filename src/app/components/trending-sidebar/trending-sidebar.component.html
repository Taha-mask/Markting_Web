<!-- trending-sidebar.component.html -->
<div
  *ngFor="let use of user"
  class="sidebar-container text-center align-items-left h-auto"
>
  <!-- User Profile -->
  <div class="py-3 my-auto">
    <a
      class="text-decoration-none text-dark"
      href="profile"
      routerlink="profile"
    >
      <div class="proimg">
        <img
          [src]="use.profileImageUrl"
          alt="Profile Picture"
          class="rounded-circle mb-2"
          width="80"
        />
      </div>
      <h4 class="mb-0" style="font-weight: 600">{{ use.username }}</h4>
      <small>{{ getUserTypeText() }}</small>
      <!-- عرض النص بناءً على نوع المستخدم -->
    </a>
    <div class="d-flex justify-content-around text-center py-3">
      <div>
        <small class="text-muted">Posts</small>
        <h6 class="mb-0">351</h6>
      </div>
      <div>
        <small class="text-muted">Followers</small>
        <h6 class="mb-0">96.28k</h6>
      </div>
      <div>
        <small class="my-following text-muted">Following</small>
        <h6 class="mb-0">{{ followingCount }}</h6>
        <!-- عرض عدد المتابعين -->
      </div>
    </div>
  </div>

  <!-- Navigation Menu -->
  <nav class="nav flex-column px-1 my-2">
    <a
      [routerLink]="['/feed']"
      class="nav-link d-flex align-items-center py-2"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="horizontal-line-hover"></span>
      <i class="bi bi-house-door me-2"></i> Feed
    </a>

    <a
      [routerLink]="['/Story']"
      class="nav-link d-flex align-items-center py-2"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="horizontal-line-hover"></span>
      <i class="bi bi-collection-play me-2"></i> Story
    </a>

    <a
      [routerLink]="['/explore']"
      class="nav-link d-flex align-items-center py-2"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="horizontal-line-hover"></span>
      <i class="bi bi-compass me-2"></i> Explore
    </a>
    <a
      [routerLink]="['/Saved-post']"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link d-flex align-items-center py-2"
    >
      <span class="horizontal-line-hover"></span>
      <i class="bi bi-bookmark me-2"></i> My Favorite
    </a>

    <a
      href="givefeedback"
      class="nav-link d-flex align-items-center py-2"
      routerlink="givefeedback"
    >
      <span class="horizontal-line-hover"></span>
      <i class="bi bi-chat-dots me-2"></i> Give Feedback
    </a>

    <a
      href="orders"
      class="nav-link d-flex align-items-center py-2"
      routerlink="orders"
    >
      <span class="horizontal-line-hover"></span>
      <i class="bi bi-bag-check me-2"></i> Orders
    </a>

    <a
      href="blog"
      class="nav-link d-flex align-items-center py-2"
      routerlink="blog"
    >
      <span class="horizontal-line-hover"></span>
      <i class="bi bi-journal-text me-2"></i> Blog
    </a>

    <a
      href="support"
      class="nav-link d-flex align-items-center py-2"
      routerlink="support"
    >
      <span class="horizontal-line-hover"></span>
      <i class="bi bi-question-circle me-2"></i> Support & Help
    </a>

    <a
      href="promotions"
      class="nav-link d-flex align-items-center py-2"
      routerlink="promotions"
    >
      <span class="horizontal-line-hover"></span>
      <i class="bi bi-megaphone me-2"></i> Promotions
    </a>

    <a
      href="account-center"
      class="nav-link d-flex align-items-center py-2"
      routerlink="account-center"
    >
      <span class="horizontal-line-hover"></span>
      <i class="bi bi-gear me-2"></i> Settings
    </a>
    <a
      href="login"
      class="nav-link text-danger d-flex align-items-center py-2 mt-3"
      routerlink="TypeAccount"
    >
      <span class="horizontal-line-hover"></span>
      <i class="bi bi-box-arrow-left me-2"></i> Log Out
    </a>
  </nav>
</div>
