<div class="modal fade" id="postModal" tabindex="-1" aria-labelledby="postModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="postModalLabel">Create Post</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex align-items-center mb-3">
          <img src="images/user-1.png" class="postimg rounded-circle me-2" alt="User Image">
          <div>
            @for (user of users; track user.username) {
              <strong>{{ user.username }}</strong>
            }
            <a class="text-muted small d-block text-decoration-none" style="cursor: pointer;">Select audience</a>
          </div>
        </div>


        <textarea class="mb-3" placeholder="What's on your mind, {{users[0].username}}?" rows="1"></textarea>

        <div class="browse rounded p-3" (dragover)="onDragOver($event)" (drop)="onDrop($event)">
          <label for="fileInput" class="form-label d-block">
            <strong>Add photos/videos</strong> or drag and drop
          </label>
          <label for="fileInput" class="custom-file-upload d-flex justify-content-center">
            <i class="bi bi-plus-circle" style="font-size: 40px; cursor: pointer;"></i>
          </label>
          <div id="imagePreview" class="mt-3 position-relative">
            @if (previewUrls.length > 0) {
              <img [src]="previewUrls[currentIndex]" alt="Image Preview" class="img-thumbnail">
              <div class="navigation-buttons">
                <button class="" (click)="prevImage()" [disabled]="currentIndex === 0">
                  <i class="bi bi-chevron-left "></i>
                </button>
                <button class=" bg-none" (click)="nextImage()" [disabled]="currentIndex === previewUrls.length - 1">
                  <i class="bi bi-chevron-right"></i>
                </button>
              </div>
              <button class="btn btn-danger btn-sm delete-button" (click)="deleteImage()">
                <i class="bi bi-trash"></i> Delete
              </button>
            }
          </div>
          <input type="file" id="fileInput" class="form-control-file w-100 d-none" (change)="onFileSelected($event)" multiple>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Post</button>
      </div>
    </div>
  </div>
</div>
