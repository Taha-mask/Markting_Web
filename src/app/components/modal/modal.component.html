<!-- Modal الأساسي -->
<div class="modal fade" id="postModal" tabindex="-1" aria-labelledby="postModalLabel" aria-hidden="true" #postModal>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="postModalLabel">Create Post</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!-- User Info -->
        <div class="d-flex align-items-center mb-3">
          <img [src]="users[0].profileImageUrl" alt="Profile Picture" class="rounded-circle me-2" style="width: 40px; height: 40px;">
          <div>
            <h6 class="mb-0">{{ users[0].username }}</h6>
          </div>
        </div>

        <!-- Audience Selector -->
        <div class="audience-selector mb-3">
          <div class="dropdown">
            <button class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2" 
                    type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i [class]="getAudienceIcon()"></i>
              {{ selectedAudience | titlecase }}
            </button>
            <ul class="dropdown-menu" style="width: 300px;">
              <li *ngFor="let option of audienceOptions">
                <button class="dropdown-item d-flex align-items-center gap-2" 
                        (click)="setAudience(option.value)">
                  <i [class]="'bi ' + option.icon"></i>
                  <div>
                    <div class="fw-bold">{{ option.label }}</div>
                    <small class="text-muted">{{ option.description }}</small>
                  </div>
                </button>
              </li>
            </ul>
          </div>
        </div>

        <!-- Categories -->
        <div class="mb-3">
          <select class="form-select" #categorySelect [(ngModel)]="selectedCategory" (change)="onCategoryChange($event)">
            <option value="">Select Category</option>
            <option *ngFor="let category of categories" [value]="category.name">
              {{ category.name }}
            </option>
          </select>
        </div>

        <!-- Subcategories -->
        <div class="mb-3" *ngIf="selectedCategory && selectedCategory !== 'All'">
          <select class="form-select" #subCategorySelect [(ngModel)]="selectedSubCategory">
            <option value="">Select Subcategory</option>
            <option *ngFor="let subCategory of getSubCategories()" [value]="subCategory">
              {{ subCategory }}
            </option>
          </select>
        </div>

        <!-- Post Content -->
        <div class="form-group">
          <textarea #postTextarea class="form-control" rows="4" placeholder="What's on your mind?"
            (dragover)="onDragOver($event)" (drop)="onDrop($event)"></textarea>
        </div>

        <!-- Image Preview -->
        <div class="image-preview mt-3" *ngIf="previewUrls.length > 0">
          <div class="position-relative">
            <img [src]="previewUrls[currentIndex]" class="img-fluid rounded" alt="Preview">
            <div class="navigation-buttons" *ngIf="previewUrls.length > 1">
              <button class="btn btn-light btn-sm" (click)="prevImage()" [disabled]="currentIndex === 0">
                <i class="bi bi-chevron-left"></i>
              </button>
              <button class="btn btn-light btn-sm" (click)="nextImage()" [disabled]="currentIndex === previewUrls.length - 1">
                <i class="bi bi-chevron-right"></i>
              </button>
            </div>
          </div>
          <div class="image-count mt-2" *ngIf="previewUrls.length > 1">
            {{ currentIndex + 1 }}/{{ previewUrls.length }}
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="d-flex justify-content-between align-items-center mt-3">
          <div>
            <button class="btn btn-light me-2" (click)="triggerFileInput()">
              <i class="bi bi-image"></i>
            </button>
            <button class="btn btn-light me-2" (click)="toggleEmojiPicker()">
              <i class="bi bi-emoji-smile"></i>
            </button>
            <input type="file" #fileInput style="display: none" (change)="onFileSelected($event)" accept="image/*" multiple>
          </div>
        </div>

        <!-- Emoji Picker -->
        <div class="emoji-picker-container" *ngIf="showEmojiPicker">
          <emoji-mart (emojiSelect)="addEmoji($event)"></emoji-mart>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" 
                (click)="addPost()" 
                [disabled]="!postTextarea.value.trim() || !selectedCategory || !selectedSubCategory">
          Post
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal الجديد -->
<div class="modal fade" id="audienceModal" tabindex="-1" aria-labelledby="audienceModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="audienceModalLabel">Select Audience</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!-- بيانات جديدة -->
        <div class="mb-3">
          <h6>Choose your audience:</h6>
          <ul class="list-group">
            <li class="list-group-item" (click)="selectAudience('public')">
              Public <input type="radio" name="audience" value="public" style="position: absolute; top:13px ; right: 10px;" [checked]="selectedAudience === 'public'">
            </li>
            <li class="list-group-item" (click)="selectAudience('friends')">
              Friends <input type="radio" name="audience" value="friends" style="position: absolute; top:13px ; right: 10px;" [checked]="selectedAudience === 'friends'">
            </li>
            <li class="list-group-item" (click)="selectAudience('onlyMe')">
              Only Me <input type="radio" name="audience" value="onlyMe" style="position: absolute; top:13px ; right: 10px;" [checked]="selectedAudience === 'onlyMe'">
            </li>
          </ul>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" (click)="saveAudience()">Save changes</button>
      </div>
    </div>
  </div>
</div>
